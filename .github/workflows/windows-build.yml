name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Release
        run: dotnet build JoyLauncher.sln --configuration Release

      - name: Publish self-contained Windows x64 app
        run: dotnet publish src/JoyLauncher.App/JoyLauncher.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/JoyLauncher

      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: JoyLauncher-Windows-x64
          path: artifacts/JoyLauncher/**
          if-no-files-found: error
          retention-days: 14
