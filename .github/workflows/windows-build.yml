name: Windows build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: joylauncher-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve release version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "src/JoyLauncher.App/JoyLauncher.App.csproj"
          $defaultVersion = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($defaultVersion)) {
            throw "The application project must define a Version."
          }

          $version = $defaultVersion
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid application version: $version"
          }

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Packaging JoyLauncher version $version"

      - name: Build Release
        run: dotnet build JoyLauncher.sln --configuration Release "-p:Version=${{ env.APP_VERSION }}"

      - name: Run automated tests
        run: dotnet test JoyLauncher.sln --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Publish self-contained Windows x64 app
        run: dotnet publish src/JoyLauncher.App/JoyLauncher.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/JoyLauncher "-p:Version=${{ env.APP_VERSION }}"

      - name: Smoke-test Windows app startup
        shell: pwsh
        run: |
          $executable = Join-Path (Resolve-Path "artifacts/JoyLauncher").Path "JoyLauncher.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Published JoyLauncher.exe was not found."
          }

          $app = Start-Process -FilePath $executable -PassThru
          try {
            Start-Sleep -Seconds 8
            $app.Refresh()
            if ($app.HasExited) {
              throw "JoyLauncher exited during the startup smoke test. Exit code: $($app.ExitCode)"
            }
            Write-Host "JoyLauncher remained running for 8 seconds without BlueStacks installed."
          }
          finally {
            $app.Refresh()
            if (-not $app.HasExited) {
              $null = $app.CloseMainWindow()
              if (-not $app.WaitForExit(5000)) {
                Stop-Process -Id $app.Id -Force
              }
            }
          }

      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-7.1.1-x64.exe"
          $uri = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe"
          Invoke-WebRequest -Uri $uri -OutFile $installer

          $expectedHash = "8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0"
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup installer SHA-256 mismatch. Expected $expectedHash, got $actualHash."
          }

          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Pyrsys B\.V\.") {
            throw "The downloaded Inno Setup compiler did not have the expected valid publisher signature."
          }

          $installDirectory = Join-Path $env:RUNNER_TEMP "Inno Setup 7"
          $arguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=`"$installDirectory`""
          )
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }

          $compiler = Join-Path $installDirectory "ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }
          "INNO_SETUP_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile per-user Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/Release" | Out-Null
          & "$env:INNO_SETUP_COMPILER" "/DAppVersion=$env:APP_VERSION" "installer/JoyLauncher.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE."
          }

          $setup = "artifacts/Release/JoyLauncher-Setup-$($env:APP_VERSION)-win-x64.exe"
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw "The versioned JoyLauncher installer was not generated."
          }

      - name: Smoke-test installer and uninstaller
        shell: pwsh
        run: |
          $setup = Join-Path $PWD "artifacts/Release/JoyLauncher-Setup-$($env:APP_VERSION)-win-x64.exe"
          $installDirectory = Join-Path $env:RUNNER_TEMP "JoyLauncher-Install-Smoke"
          if (Test-Path -LiteralPath $installDirectory) {
            Remove-Item -LiteralPath $installDirectory -Recurse -Force
          }

          $installArguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=`"$installDirectory`""
          )
          $install = Start-Process -FilePath $setup -ArgumentList $installArguments -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "JoyLauncher installer returned exit code $($install.ExitCode)."
          }

          $installedExe = Join-Path $installDirectory "JoyLauncher.exe"
          $uninstaller = Join-Path $installDirectory "unins000.exe"
          if (-not (Test-Path -LiteralPath $installedExe -PathType Leaf) -or
              -not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw "Installer smoke test could not find the installed app and uninstaller."
          }

          $remove = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          ) -Wait -PassThru
          if ($remove.ExitCode -ne 0) {
            throw "JoyLauncher uninstaller returned exit code $($remove.ExitCode)."
          }
          if (Test-Path -LiteralPath $installedExe) {
            throw "JoyLauncher.exe still exists after uninstall."
          }
          Write-Host "Per-user install and clean uninstall passed."

      - name: Create portable package and release metadata
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $PWD "artifacts/Release"
          $portable = Join-Path $releaseDirectory "JoyLauncher-Portable-$($env:APP_VERSION)-win-x64.zip"
          Compress-Archive -Path "artifacts/JoyLauncher/*" -DestinationPath $portable -CompressionLevel Optimal -Force
          Copy-Item -LiteralPath "RELEASE_NOTES.md" -Destination (Join-Path $releaseDirectory "RELEASE_NOTES.md") -Force

          @(
            "Product: JoyLauncher"
            "Version: $env:APP_VERSION"
            "Target: Windows x64"
            "Configuration: Release"
            "Source commit: $env:GITHUB_SHA"
            "Workflow run: $env:GITHUB_RUN_ID"
            "Run number: $env:GITHUB_RUN_NUMBER"
            "Built by: GitHub Actions"
            "Installer: per-user, no administrator rights required"
            "Code signing: Not configured; JoyLauncher binaries are unsigned"
            "Runtime: BlueStacks 5 must be installed separately"
          ) | Set-Content -Encoding utf8 (Join-Path $releaseDirectory "BUILD-INFO.txt")

          $manifest = Join-Path $releaseDirectory "SHA256SUMS.txt"
          $lines = Get-ChildItem -LiteralPath $releaseDirectory -File |
            Where-Object { $_.FullName -ne $manifest } |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
              "$($hash.Hash)  $($_.Name)"
            }
          $lines | Set-Content -Encoding ascii $manifest

      - name: Verify release checksums
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $PWD "artifacts/Release"
          $manifest = Join-Path $releaseDirectory "SHA256SUMS.txt"
          foreach ($line in Get-Content -LiteralPath $manifest) {
            if ($line -notmatch '^([A-Fa-f0-9]{64})  (.+)$') {
              throw "Invalid checksum manifest line: $line"
            }
            $expected = $Matches[1].ToLowerInvariant()
            $fileName = $Matches[2]
            $filePath = Join-Path $releaseDirectory $fileName
            if (-not (Test-Path -LiteralPath $filePath -PathType Leaf)) {
              throw "Checksum manifest references a missing file: $fileName"
            }
            $actual = (Get-FileHash -LiteralPath $filePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "Checksum mismatch for $fileName."
            }
          }
          Write-Host "All release package checksums verified."

      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseArguments = @(
            "artifacts/Release/JoyLauncher-Setup-$($env:APP_VERSION)-win-x64.exe",
            "artifacts/Release/JoyLauncher-Portable-$($env:APP_VERSION)-win-x64.zip",
            "artifacts/Release/BUILD-INFO.txt",
            "artifacts/Release/RELEASE_NOTES.md",
            "artifacts/Release/SHA256SUMS.txt",
            "--verify-tag",
            "--title",
            "JoyLauncher $($env:APP_VERSION)",
            "--notes-file",
            "RELEASE_NOTES.md"
          )
          if ($env:APP_VERSION.Contains("-")) {
            $releaseArguments += "--prerelease"
          }
          gh release create "$env:GITHUB_REF_NAME" @releaseArguments

      - name: Upload versioned Windows release packages
        uses: actions/upload-artifact@v6
        with:
          name: JoyLauncher-Release-Windows-x64
          path: artifacts/Release/*
          if-no-files-found: error
          retention-days: 30
